services:
  app:
    build: .
    container_name: oljalerts-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://job_alert_client:job_alert_client_password@postgres:5432/oljalerts
      SYNC_INTERVAL_MS: 120000
      SYNC_BATCH: 5
      NOTIFIER_INTERVAL_MS: 20000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: oljalerts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: postgres
    ports:
      - "5700:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/database_setup.sql:/docker-entrypoint-initdb.d/01-database_setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
